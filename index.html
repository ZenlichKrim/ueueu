<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>МуриноБот</title>
<link rel="manifest" href="manifest.json">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0a0c0a; --card: #161a16; --card-2: #1c221c;
    --border: #242a24; --text: #d4d8d4; --text-dim: #7a847a;
    --accent: #7ba87b; --accent-dim: #4a7a4a;
    --user-bubble: #253025; --user-text: #e2e8e2;
  }
  html, body { margin: 0; padding: 0; height: 100%; overscroll-behavior: none; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
  header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; background: rgba(10,12,10,0.9); backdrop-filter: blur(20px); flex-shrink: 0; }
  .logo { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, #1e281e, #141a14); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; }
  .logo svg { width: 20px; height: 20px; }
  .title-block { flex: 1; }
  .title { font-size: 15px; font-weight: 600; margin: 0; }
  .subtitle { font-size: 11px; color: var(--text-dim); margin: 1px 0 0; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 2.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  #progressPanel { padding: 14px 16px; background: var(--card); border-bottom: 1px solid var(--border); display: none; flex-direction: column; gap: 8px; }
  #progressPanel.show { display: flex; }
  #stage { color: var(--accent); font-size: 13px; font-weight: 600; }
  #file { color: var(--text-dim); font-size: 12px; font-family: monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  #bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent-dim), var(--accent)); transition: width 0.3s; }
  #pct { color: var(--accent); font-size: 12px; text-align: right; font-weight: 600; }
  #messages { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 90%; padding: 12px 16px; border-radius: 18px; white-space: pre-wrap; word-wrap: break-word; font-size: 14.5px; line-height: 1.6; animation: msgIn 0.35s ease; }
  @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .msg.user { align-self: flex-end; background: var(--user-bubble); color: var(--user-text); border-bottom-right-radius: 6px; }
  .msg.bot { align-self: flex-start; background: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 6px; }
  .typing { display: inline-flex; gap: 5px; align-items: center; padding: 4px 0; }
  .typing span { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: tp 1.3s ease-in-out infinite; }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes tp { 0%,100% { opacity:0.3; transform:scale(0.75); } 50% { opacity:1; transform:scale(1.2); } }
  .quick { padding: 0 12px 8px; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; flex-shrink: 0; }
  .quick::-webkit-scrollbar { display: none; }
  .quick button { background: var(--card); border: 1px solid var(--border); color: var(--text-dim); padding: 7px 14px; border-radius: 16px; font-size: 12px; cursor: pointer; white-space: nowrap; font-family: inherit; }
  .input-area { padding: 8px 12px 20px; flex-shrink: 0; }
  .input-wrap { display: flex; background: var(--card-2); border: 1px solid var(--border); border-radius: 24px; padding: 6px 6px 6px 18px; }
  .input-wrap:focus-within { border-color: var(--accent-dim); }
  #input { flex: 1; background: transparent; border: none; outline: none; color: var(--text); font-size: 15px; padding: 10px 0; font-family: inherit; }
  #input:disabled { opacity: 0.4; }
  #send { width: 40px; height: 40px; border-radius: 50%; background: var(--accent-dim); border: none; color: #e8f0e8; cursor: pointer; font-size: 18px; }
  #send:disabled { opacity: 0.3; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <svg viewBox="0 0 16 16" shape-rendering="crispEdges">
      <rect x="2" y="1" width="12" height="1" fill="#7ba87b" opacity="0.3"/>
      <rect x="1" y="2" width="14" height="1" fill="#7ba87b" opacity="0.5"/>
      <rect x="0" y="4" width="16" height="1" fill="#7ba87b" opacity="0.7"/>
      <rect x="0" y="6" width="16" height="1" fill="#7ba87b"/>
      <rect x="4" y="6" width="2" height="2" fill="#0a0c0a"/>
      <rect x="10" y="6" width="2" height="2" fill="#0a0c0a"/>
    </svg>
  </div>
  <div class="title-block">
    <p class="title">МуриноБот</p>
    <p class="subtitle" id="sub">v20 · WASM</p>
  </div>
  <div class="dot"></div>
</header>

<div id="progressPanel">
  <div id="stage">Подготовка...</div>
  <div id="file"></div>
  <div class="bar"><div id="bar"></div></div>
  <div id="pct">0%</div>
</div>

<div id="messages"></div>

<div class="quick" id="quick">
  <button data-q="Расскажи подробно про Мурино">Мурино</button>
  <button data-q="Кто такой Фог">Фог</button>
  <button data-q="Расскажи про Друна">Друн</button>
  <button data-q="Опиши все сезоны">Сезоны</button>
  <button data-q="Что такое бурмалда">Бурмалда</button>
</div>

<div class="input-area">
  <div class="input-wrap">
    <input id="input" type="text" placeholder="Загрузка модели..." autocomplete="off" disabled>
    <button id="send" disabled>➤</button>
  </div>
</div>

<script type="module">
import { pipeline, TextStreamer, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0';

env.allowLocalModels = false;
env.useBrowserCache = true;
if (env.backends?.onnx?.wasm) {
  env.backends.onnx.wasm.numThreads = 1;
  env.backends.onnx.wasm.simd = true;
}

const SYSTEM_PROMPT = `Ты — ассистент администрации Мурино. Отвечай кратко и по факту, как сотрудник справочной.

Правила языка:
- Существительные длиннее 3 букв получают суффикс -ость. Пример: кот → котость, дом → домость.
- Я → Ч. Друг → друн. Дед → дод.
- Глаголы НЕ изменяются.

Знай про Мурино:
- Мурино — город из бесконечных гигахрущёвок. Выход: трамвай до Села Молочного, лифт на 1488 этаже, пешком к Мытищам.
- На 666 этаже обитает Фог — туман-полубог. THE FOG IS COMING.
- 1488 этаж — технический, курьеры туда не ходят.
- Божество Мурино — Малекус.
- Сезоны: Темщики, Армия, Общага, Мурино, Село Молочное, Мытищи, Элджеевка.
- Персонажи: Ч, Друн, Батч, Дод, Котость, Артур, Мойдодыр. Бурмалда — казино, где нельзя выиграть.

Отвечай 2–4 предложениями. Без метафор.`;

const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
const progressPanel = document.getElementById('progressPanel');
const stageEl = document.getElementById('stage');
const fileEl = document.getElementById('file');
const barEl = document.getElementById('bar');
const pctEl = document.getElementById('pct');
const subEl = document.getElementById('sub');

let generator = null;
let isSending = false;

function setStage(s, f, p) {
  stageEl.textContent = s;
  if (f !== undefined) fileEl.textContent = f;
  if (p !== undefined) {
    const v = Math.max(0, Math.min(100, p));
    barEl.style.width = v + '%';
    pctEl.textContent = Math.round(v) + '%';
  }
}

function addMsg(text, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

async function load() {
  try {
    progressPanel.classList.add('show');
    setStage('Подключение к библиотеке...', 'transformers.js v3', 5);
    await new Promise(r => setTimeout(r, 300));

    let done = 0;
    setStage('Загрузка модели (~400 МБ)...', 'первый запуск', 10);

    generator = await pipeline(
      'text-generation',
      'onnx-community/Qwen2.5-0.5B-Instruct',
      {
        dtype: 'q4',
        device: 'wasm',
        progress_callback: (p) => {
          const fn = (p.file || '').split('/').pop();
          if (p.status === 'progress' && p.progress != null) {
            const overall = 10 + done * 10 + p.progress * 0.1;
            setStage('Загрузка модели...', fn, Math.min(overall, 90));
          } else if (p.status === 'done') {
            done++;
            setStage('Файл ' + done + ' готов', fn, Math.min(10 + done * 10, 90));
          } else if (p.status === 'ready') {
            setStage('Все файлы загружены', '', 90);
          }
        }
      }
    );

    setStage('Инициализация в памяти...', '', 95);
    await new Promise(r => setTimeout(r, 500));
    setStage('Готово!', '', 100);
    await new Promise(r => setTimeout(r, 400));
    progressPanel.classList.remove('show');

    subEl.textContent = 'v20 · готов';
    addMsg('Привит. Справочная на связи. Задавайте вопрос.', 'bot');
    inputEl.disabled = false;
    sendBtn.disabled = false;
    inputEl.placeholder = 'Введите ваш вопрос...';
    inputEl.focus();
  } catch (e) {
    setStage('Ошибка: ' + e.message, '', 0);
    console.error(e);
    addMsg('Не удалось запустить модель: ' + e.message, 'bot');
  }
}

async function send() {
  if (isSending || !generator) return;
  const text = inputEl.value.trim();
  if (!text) return;

  isSending = true;
  inputEl.value = '';
  inputEl.disabled = true;
  sendBtn.disabled = true;

  addMsg(text, 'user');

  const botDiv = document.createElement('div');
  botDiv.className = 'msg bot';
  botDiv.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
  messagesEl.appendChild(botDiv);
  messagesEl.scrollTop = messagesEl.scrollHeight;

  let firstChunk = true;
  let fullText = '';
  const t0 = Date.now();

  try {
    const messages = [
      { role: 'system', content: SYSTEM_PROMPT },
      { role: 'user', content: text }
    ];

    const streamer = new TextStreamer(generator.tokenizer, {
      skip_prompt: true,
      skip_special_tokens: true,
      callback_function: (chunk) => {
        if (firstChunk) {
          const rem = Math.max(0, 600 - (Date.now() - t0));
          setTimeout(() => {
            botDiv.innerHTML = '';
            fullText = chunk;
            botDiv.textContent = fullText;
            messagesEl.scrollTop = messagesEl.scrollHeight;
          }, rem);
          firstChunk = false;
        } else {
          fullText += chunk;
          if (!botDiv.querySelector('.typing')) {
            botDiv.textContent = fullText;
            messagesEl.scrollTop = messagesEl.scrollHeight;
          }
        }
      }
    });

    await generator(messages, {
      max_new_tokens: 250,
      temperature: 0.35,
      do_sample: true,
      top_p: 0.85,
      repetition_penalty: 1.4,
      streamer: streamer
    });

    if (!fullText.trim()) {
      botDiv.innerHTML = '';
      botDiv.textContent = 'Нрт.';
    } else if (botDiv.querySelector('.typing')) {
      botDiv.innerHTML = '';
      botDiv.textContent = fullText;
    }
  } catch (e) {
    botDiv.innerHTML = '';
    botDiv.textContent = 'Ошибка: ' + e.message;
  } finally {
    isSending = false;
    inputEl.disabled = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

sendBtn.addEventListener('click', send);
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
document.querySelectorAll('.quick button').forEach(b => {
  b.addEventListener('click', () => {
    if (isSending || !generator) return;
    inputEl.value = b.dataset.q;
    send();
  });
});

load();
</script>
</body>
</html>
